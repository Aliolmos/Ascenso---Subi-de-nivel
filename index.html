<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14112b" />
    <meta name="description" content="Hábitos, finanzas, entrenamiento y metas, con XP y niveles." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ascenso" />
    <title>Ascenso — Subí de nivel cada día</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside id="side"></aside>
      <main id="view"></main>
    </div>
    <nav class="bnav" id="bnav"></nav>
    <div class="sheet" id="sheet"><div class="pane" id="sheetPane"></div></div>
    <div class="toasts" id="toasts"></div>
    <div id="modal"></div>
    <div id="auth" style="display: none">
      <div id="authLoad" style="text-align: center">
        <div class="spin"></div>
        <p class="mu sm" style="margin-top: 12px">Cargando…</p>
      </div>
      <div id="authBox" class="card" style="display: none; padding: 26px">
        <div class="logo">
          <span class="mark"
            ><svg viewBox="0 0 24 24">
              <path d="M6 13l6-6 6 6" />
              <path d="M6 19l6-6 6 6" /></svg></span
          >Ascenso
        </div>
        <p class="mu" style="text-align: center">Subí de nivel cada día</p>
        <div class="seg" style="display: flex; margin-top: 18px">
          <button style="flex: 1" class="on" data-m="in" id="tIn">Ingresar</button
          ><button style="flex: 1" data-m="up" id="tUp">Crear cuenta</button>
        </div>
        <form id="authF">
          <input
            name="name"
            id="aName"
            placeholder="Tu nombre"
            style="display: none"
            autocomplete="given-name"
          />
          <input name="email" type="email" placeholder="Email" required autocomplete="email" />
          <input
            name="pass"
            type="password"
            placeholder="Contraseña"
            required
            minlength="6"
            autocomplete="current-password"
          />
          <button class="btn" id="aBtn">Ingresar</button>
          <p id="aErr" class="sm bad" style="min-height: 18px; text-align: center"></p>
        </form>
        <div class="or">o</div>
        <button class="gbtn" id="aGoogle">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path
              fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"
            />
            <path
              fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
            />
            <path
              fill="#4CAF50"
              d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"
            />
            <path
              fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"
            /></svg
          >Continuar con Google
        </button>
        <p style="text-align: center; margin-top: 16px">
          <button class="link" id="aReset">¿Olvidaste tu contraseña?</button>
        </p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
